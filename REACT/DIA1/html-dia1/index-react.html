<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./data/platos.mock.js"></script>
    <script type="text/babel">
        // Sale error porque no es type module
        // import {platosMock} from './data/platos.mock.js'; 
        function Carta({ platos }) {
            return (
                <div>
                    {platos.map(plato => (
                        <PlatoCard key={plato.id} plato={plato} />
                    ))}
                </div>
            );
        }
        function PlatoCard({ plato }) {
            return (
                <div className={`cardPlato ${plato.disponible ? "disponible" : "no-disponible"}`}>
                    <h3>{plato.nombre}</h3>
                    <p>Categoría: {plato.categoria}</p>
                    <p>Precio: S/ {plato.precio}</p>
                    <p>Stock: {plato.stock}</p>
                    <p>{plato.disponible ? "✅ Disponible" : "❌ Agotado"}</p>
                </div>
            )
        }
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Carta platos={platosMock} />);
    </script>

</body>

</html>
