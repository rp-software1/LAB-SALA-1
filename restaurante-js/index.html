<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Restaurante — Día 1" />
    <meta name="author" content="Sala 1 - Samir Ochoa y Flavio Silva">
    <meta name="robots" content="max-image-preview:large">

    <title>Restaurante — Día 1</title>
    <script src="js/app.js" defer></script>
</head>
<body>

    <h1>Menú del Restaurante</h1>

    <button id="btnMostrar">Mostrar menú</button>

    <form id="form-add-platoMenu">
        <div class="box-input">
            <input type="text" id="nombreNewPlato" 
            placeholder="Nombre" required>
        </div>
        <div class="box-input">
            <input type="text" id="precioNewPlato" 
            placeholder="Precio" required>
        </div>
        <div class="box-input">
            <input type="text" id="stockNewPlato" 
            placeholder="Stock" required>
        </div>
        <div class="box-input">
            <input id="btnAgregar" type="submit" value="Agregar plato">
        </div>

    </form>

    <div id="output"></div>

</body>
</html>
