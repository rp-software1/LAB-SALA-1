<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Restaurante — Día 1" />
    <meta name="author" content="Sala 1 - Samir Ochoa y Flavio Silva">
    <meta name="robots" content="max-image-preview:large">

    <title>Restaurante — Día 1: Samir Ochoa y Flavio</title>
    <script src="js/app.js" defer></script>
    <link rel="icon" href="img/icon.png" type="image/png">
</head>

<body>

    <h1>Menú del Restaurante de Samir Ochoa y Flavio</h1>

    <button id="btnMostrar">Mostrar menú</button>

    <form id="form-add-platoMenu">
        <div class="box-input">
            <input type="text" id="nombreNewPlato" placeholder="Nombre" required>
        </div>
        <div class="box-input">
            <input type="text" id="precioNewPlato" placeholder="Precio" required>
        </div>
        <div class="box-input">
            <input type="text" id="stockNewPlato" placeholder="Stock" required>
        </div>
        <div class="box-input">
            <input id="btnAgregar" type="submit" value="Agregar plato">
        </div>

    </form>

    <hr>

    <h2>Herramientas</h2>

    <input id="inputBuscar" placeholder="Buscar plato por nombre" />
    <button id="btnBuscar">Buscar</button>

    <button id="btnStockBajo">Ver stock bajo (<= 3)</button>

    <button id="btnResumen">Ver resumen</button>

    <hr>

    <div id="output"></div>

</body>

</html>
